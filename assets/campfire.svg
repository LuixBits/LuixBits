<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="120" viewBox="0 0 880 120" role="img" aria-labelledby="t d"><title id="t">Campfire</title><desc id="d">A campsite. At night the fire burns; by day, smoke and birds.</desc><style>@font-face{font-family:'HurmitSub';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HurmitSub';font-weight:700;src:url(data:font/woff;base64,) format('woff')}text{font-family:'HurmitSub','Hurmit Nerd Font Mono','Hurmit','Hermit',monospace}.tw{animation:tw var(--d,5s) ease-in-out var(--dd,0s) infinite alternate}.drift{animation:dr var(--d,40s) ease-in-out infinite alternate}.ffw{animation:ffd var(--d,8s) ease-in-out var(--dd,0s) infinite alternate}.ffp{animation:ffp var(--p,4s) ease-in-out var(--dd,0s) infinite alternate}.mote{animation:mt var(--p,6s) ease-in-out var(--dd,0s) infinite alternate}.blink{animation:bl 1.3s steps(2,start) infinite}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flm var(--fd,1s) ease-in-out infinite alternate}.spk{animation:spk var(--d,2.6s) linear var(--dd,0s) infinite}.smoke{animation:smk 5s ease-in-out infinite alternate}.br{animation:br var(--p,7s) ease-in-out var(--dd,0s) infinite alternate}@keyframes tw{from{opacity:.12}to{opacity:.75}}@keyframes dr{to{transform:translateX(var(--tx,20px))}}@keyframes ffd{to{transform:translate(var(--tx,10px),var(--ty,-8px))}}@keyframes ffp{from{opacity:.12}to{opacity:1}}@keyframes mt{from{opacity:.05}to{opacity:.4}}@keyframes bl{to{visibility:hidden}}@keyframes flm{from{transform:scaleY(.93)}to{transform:scaleY(1.07)}}@keyframes spk{0%{transform:translateY(0);opacity:.85}100%{transform:translateY(-30px);opacity:0}}@keyframes smk{from{opacity:.22}to{opacity:.55}}@keyframes br{from{opacity:.45}to{opacity:1}}.sway{animation:sway var(--p,14s) ease-in-out infinite alternate}.hike{animation:hike 85s linear infinite}.bob{animation:bob .7s ease-in-out infinite alternate}.shoot{ani