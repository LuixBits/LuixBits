name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LuixBits
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Zurich

          # Languages: computed from actual commit history, not just repo bytes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css

          # Stars: top starred repos + totals
          plugin_stars: yes
          plugin_stars_limit: 4

          # Visitors: page views across your repos (last 14 days)
          plugin_traffic: yes

          # Contribution calendar (current year)
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Lines of code added/removed
          plugin_lines: yes
