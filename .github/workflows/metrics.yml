name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Falls back to the built-in Actions token so the first run works
          # out of the box; add a METRICS_TOKEN secret (classic PAT, repo scope)
          # to unlock full data (traffic/visitors, private commit counts).
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: LuixBits
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Zurich
          plugins_errors_fatal: no

          # Languages: GitHub's per-repo language data
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css

          # Visitors: page views across your repos (needs METRICS_TOKEN with repo scope)
          plugin_traffic: yes

          # Contribution calendar (current year)
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Lines of code added/removed
          plugin_lines: yes
